version: v2beta1
name: auto-tester

# Local-against-cluster dev loop. Builds the image, runs a long-lived dev pod,
# syncs local source into it, and gives an interactive shell + port-forward.
# Reconcile with vcita's shared devspace setup during Infra onboarding.

images:
  auto-tester:
    image: auto_tester
    dockerfile: ./Dockerfile

deployments:
  auto-tester-dev:
    kubectl:
      inlineManifest: |-
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: auto-tester-dev
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: auto-tester-dev
          template:
            metadata:
              labels:
                app: auto-tester-dev
            spec:
              containers:
                - name: auto-tester
                  image: auto_tester
                  command: ["sleep", "infinity"]

dev:
  auto-tester:
    labelSelector:
      app: auto-tester-dev
    devImage: auto_tester
    sync:
      - path: ./:/auto_tester
        excludePaths:
          - .git/
          - .venv/
          - reports/
          - runs_index/
          - .temp_videos/
          - .temp_screenshots/
          - .context/
          - .accounts/
    terminal:
      command: bash
    ports:
      - port: "8080"
    env:
      - name: TARGET_ENV
        value: integration
