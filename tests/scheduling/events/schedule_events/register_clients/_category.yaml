- id: register_clients
  name: Schedule event and register multiple clients
  status: active
  priority: high
  description: Schedule a require-to-pay event via the back office assigned to a created
    staff, assert the event details and empty attendance, register two clients via
    the client picker, assert both appear as attendees, and assert the registration
    conversation in the client portal.
status: active
