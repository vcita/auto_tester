name: Register Clients To Event
description: On a fresh account, schedule a require-to-pay event from the back office
  (next month, assigned to a created staff member), assert the event instance details
  (location, date, state, price, currency, staff, registration availability, attendance
  summary), register two clients, assert the attendee list, and assert the registered
  client's client-portal conversation includes the "Event Registration" title.
account_profile:
  type: isolated
  slug: schedevt_reg
  cleanup: always
