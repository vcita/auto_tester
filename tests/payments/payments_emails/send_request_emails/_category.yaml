name: Send Payment Request Emails
description: On a fresh account (point_of_sale denied) with a "suggest to pay" $100
  service and an API-scheduled appointment, send the appointment payment-request link
  by email ("New payment request from <business>"), invoice the appointment ("New
  invoice from <business>"), then send the invoice payment-request link by email ("New
  payment request from <business>" again).
account_profile:
  type: isolated
  slug: pe_req
  cleanup: always
