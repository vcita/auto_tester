# QR Code Payment Subcategory
# Migrated from automation-js/features/salsa/qr-code-payment.feature (VCITA2-13850)
# Isolated account (fresh per run) so the sale/payment are deterministically
# numbered Sale #1 / Payment for Sale #1 - <service>, matching the legacy
# fresh-account assumption, and so client_portal_checkout_v2 can be enabled
# before login.

name: QR Code Payment
description: Grab a QR-code payment link from the POS for a paid service ($100), pay it through the client-portal link in a separate tab via the mock gateway, verify the QR dialog shows payment success, and verify the back-office payment page (name, $100.00, Credit Card (Online), service item).

account_profile:
  type: isolated
  slug: qr_code_payment
  cleanup: always

execution_order:
  - pay_with_qr

tests:
  - id: pay_with_qr
    name: Pay with QR code
    status: active
    priority: high
    description: Connect the mock gateway, grab a QR payment link from the POS for the paid service (service-pay+seq, $100), pay it via the client-portal link in a separate tab through the mock gateway, verify the mobile payment success page and the back-office QR dialog success, then verify the Payments Received payment page shows Payment for Sale #1 - service, $100.00, Credit Card (Online), and the service item.

status: active
priority: high
tags:
  - payments
  - pos
  - qr_code
  - migration
owner: QA Team
created_at: 2026-06-06
