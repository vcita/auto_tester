# Pay for appointment via Point of Sale (isolated account, point_of_sale enabled)
# Migrated from appointment-payments.feature scenario 3b
# "paying for appointment via Point of Sale" (VCITA2-13857).

name: Pay Appointment Via POS
description: On a fresh account (point_of_sale enabled) with a "require to pay" $100 service and an API-scheduled appointment for "first last", record the payment through Point of Sale and assert the request is PAID $100.00, with the sale visible in Payments Received.

account_profile:
  type: isolated
  slug: apptpay_pos
  cleanup: always

tests:
  - id: pay_pos
    name: Pay for appointment via Point of Sale
    status: active
    priority: high
    description: Record the appointment payment request through POS; assert PAID $100.00 and that Payments Received shows "Payment for Sale #1 - service-rtp".

