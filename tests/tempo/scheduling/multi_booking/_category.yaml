name: Multi-booking Appointments
description: Schedule a single multi-service (linked) appointment from the back office,
  then cancel one linked appointment or all of them and verify the resulting states.
  Migrated from automation-js features/tempo/multi-booking-appointments.feature.
account_profile:
  type: isolated
  slug: multi_booking
  cleanup: always
execution_order:
- cancel_single
- cancel_all
tests:
- id: cancel_single
  name: Cancel single multi-booking appointment
  status: active
  priority: high
  description: Schedule a 3-service linked appointment, cancel only the first linked
    appointment, and verify it is Cancelled and unlinked while the other two remain
    Scheduled and linked (count 2).
  tags:
  - scheduling
  - appointments
  - multi_booking
- id: cancel_all
  name: Cancel all multi-booking appointments
  status: active
  priority: high
  description: Schedule a 3-service linked appointment, cancel all linked appointments
    at once, and verify all three are Cancelled and the client conversation shows
    a cancelled linked-booking bubble for the three services.
  tags:
  - scheduling
  - appointments
  - multi_booking
status: active
priority: high
tags:
- scheduling
- appointments
- multi_booking
owner: QA Team
created_at: 2026-06-03
stability:
  status: stable
  last_stress_test: '2026-06-15'
  pass_rate: 100.0%
  iterations: 10
