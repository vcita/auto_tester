# Notes Subcategory
# Tests for adding, editing, and deleting notes on matters
# This subcategory runs inline within the clients category

name: Notes
description: Tests for managing notes on matters (add, edit, delete)

# Run order is defined in parent clients/_category.yaml (execution_order: notes after edit_contact)

# Execution order - tests run sequentially in this order
tests:
  - id: add_note
    name: Add Note
    status: active
    priority: high
  - id: edit_note
    name: Edit Note
    status: active
    priority: high
  - id: delete_note
    name: Delete Note
    status: active
    priority: high
# Note: the new-POV notes flow (create_edit_note_no_summary, VCITA2-13033) lives in the
# sibling isolated subcategory tests/tempo/clients/new_notes/ — it needs rollout.clients.new_notes
# ON before app load, which would break these legacy-UI tests if enabled on the shared account.

# Category metadata
