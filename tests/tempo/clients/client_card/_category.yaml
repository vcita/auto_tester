# Client Card Subcategory
# Migrated from automation-js/features/steps/client-card.feature (VCITA2-13855)
# Isolated account (fresh per run) so the custom fields start empty (fixed names
# client_field/contact_field) and the CRM filter results are deterministic.

name: Client Card
description: Add a client custom field and a contact custom field via Client Card Settings, seed a client per field value via API, filter the CRM list by each field value, and rename each field (post-rename re-search omitted upstream per SUPPORT-6006).

account_profile:
  type: isolated
  slug: client_card
  cleanup: always

execution_order:
  - client_card_fields

tests:
  - id: client_card_fields
    name: Client and contact custom card fields
    status: active
    priority: high
    description: Add a "client" Single line text field (client_field) and a "contact" Single line text field (contact_field) via Client Card Settings; create clients carrying client_field=blublublu and contact_field='test field' via API; filter the CRM list by each field value asserting the matching client; and rename client_field->client_field_1 and contact_field->contact_field_1.

status: active
priority: high
tags:
  - clients
  - crm
  - custom_fields
  - client_card
  - migration
owner: QA Team
created_at: 2026-06-06
