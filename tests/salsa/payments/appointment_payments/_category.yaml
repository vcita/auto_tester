# Appointment Payments (grouping subcategory)
# Migrated from automation-js/features/salsa/appointment-payments.feature (VCITA2-13857)
# Each legacy scenario runs on a fresh automatic account, and the point_of_sale
# feature flag conflicts across scenarios (some deny it, the POS scenarios need
# it), so every scenario is its own isolated child subcategory with its own
# account + Background (client + appointment service + scheduled appointment).

name: Appointment Payments
description: Appointment payment-request flows migrated from appointment-payments.feature - request lifecycle (create/edit/cancel), paying (partial + full), POS record-payment, cancel & refund, invoiced appointment, package redemption (schedule/complete/refund), and custom-fee service with tax + discount. Each scenario uses its own isolated account.

execution_order:
  - payment_request_created
  - edit_cancel_request
  - pay_for_appointment
  - pay_via_pos
  - cancel_refund
  - invoiced_appointment
  - packaged_service
  - custom_fee_service

status: active
priority: high
tags:
  - payments
  - appointments
  - migration
owner: QA Team
created_at: 2026-06-06
