# Paying for an invoiced event (isolated account)
# Migrated from event-payments.feature scenario 4 "Paying for and invoiced event".

name: Paying For Invoiced Event
description: On a fresh account with a "require to pay" $10 event and one registered client, create an invoice from the event payment request, pay the invoice ($10), and verify the invoice page shows PAID $10.00 and the payment appears in Payments Received.

account_profile:
  type: isolated
  slug: evtpay_inv
  cleanup: always

tests:
  - id: invoiced_event
    name: Pay for invoiced event
    status: active
    priority: high
    description: Invoice the event payment request (name "event_invoice", billing address), pay the invoice $10, assert the invoice page shows PAID $10.00 for "first last" / item "<event>" / "event_invoice #0000001", and that "Payment for event_invoice #0000001" appears in Payments Received.

status: active
priority: high
tags:
  - payments
  - events
  - invoices
  - migration
owner: QA Team
created_at: 2026-06-06
