# Pay for an invoiced product (isolated account)
# Migrated from products.feature scenario 5 "user pays for an invoiced product" (VCITA2-13858).

name: Invoiced Product
description: On a fresh account with a $10 payable product assigned to "first last", create an invoice from the product, pay the invoice in full, and assert the product payment request becomes PAID $10.00 with the invoice payment in Payments Received.

# slug avoids the term "invoice": the directory account-creation content filter
# rejects any business_name containing it (HTTP 403 "contains invalid term").
account_profile:
  type: isolated
  slug: prodpay_billed
  cleanup: always

tests:
  - id: invoiced
    name: Pay for an invoiced product
    status: active
    priority: high
    description: Invoice the product (product_invoice), pay the invoice $10, and assert PAID $10.00 with "Payment for product_invoice #0000001" in Payments Received.

status: active
priority: high
tags:
  - payments
  - products
  - migration
owner: QA Team
created_at: 2026-06-06
stability:
  status: stable
  last_stress_test: '2026-06-14'
  pass_rate: 100.0%
  iterations: 10
