name: Import Products
description: Import 3 valid products from an Excel file with a tax assigned, verify
  search-by-name and search-by-SKU plus the assigned product tax, and download the
  import template. Migrated from automation-js import_products.feature (scenarios 1
  and 3, sharing one account as the template download does not affect product data).
account_profile:
  type: isolated
  slug: prodimp
  cleanup: always
execution_order:
- import_with_tax
- download_template
tests:
- id: import_with_tax
  name: Import Excel With Tax
  status: active
  priority: high
  description: Import products_with_sku.xlsx (3 products), assign a tax during import,
    then verify search by name, search by SKU, and the product's tax
  tags:
  - products
  - import
- id: download_template
  name: Download Import Template
  status: active
  priority: medium
  description: Download the products import template from the wizard and verify the
    downloaded file name
  tags:
  - products
  - import
status: active
priority: high
