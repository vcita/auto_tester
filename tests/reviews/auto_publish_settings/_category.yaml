name: Auto-publish Settings
description: Review auto-publish settings visibility and configuration for a business
  created inside a directory. The directory's external review site drives whether the
  auto-publish checkbox appears in the back-office reviews settings and the client
  portal review page. Migrated from automation-js features/tempo/reviews.feature
  (scenarios 2 & 3).
account_profile:
  type: isolated
  slug: reviews_auto_publish
  cleanup: always
execution_order:
- auto_publish_hidden
- set_auto_publish
tests:
- id: auto_publish_hidden
  name: Auto-publish Hidden Without Review Site
  status: active
  priority: high
  description: A business in a directory with no external review site does not see the
    auto-publish checkbox in the back-office reviews settings page nor in the client
    portal review page.
  tags:
  - reviews
- id: set_auto_publish
  name: Set Auto-publish Setting
  status: active
  priority: high
  description: A business in a directory with an external review site (vcita) configures
    a review platform, enables auto-publish, and verifies the checkbox is checked and
    labelled with the review site name, and that the client portal review page shows
    the auto-publish checkbox.
  tags:
  - reviews
status: active
priority: high
tags:
- reviews
owner: QA Team
created_at: 2026-06-06
