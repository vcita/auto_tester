# NOTE: three "integration" values below look redundant but are intentionally
# separate and may legitimately differ:
#   - environment (here): the SSM path segment -> /<environment>/<release>/<secret>
#   - TARGET_ENV (per job): which deployed env the tests run AGAINST (env_config resolves URLs)
#   - ENVIRONMENT (per job): the runner's own logic env (config/log behavior)
environment: integration

jobs:
  - name: full-run
    # Nightly at 02:00 in the CronJob controller's timezone (typically UTC), not local.
    schedule: "0 2 * * *"
    # Fully overrides the image ENTRYPOINT. $(TARGET_ENV) is substituted from env below.
    command: ["python3", "main.py", "run", "--headless", "--env", "$(TARGET_ENV)"]
    env:
      - name: TARGET_ENV
        value: "integration"
      - name: ENVIRONMENT
        value: "integration"
    # SSM JSON at /integration/<release>/auto-tester-creds with keys
    # VCITA_ADMIN_TOKEN and VCITA_DIRECTORY_ID, injected as env vars.
    secrets:
      - name: auto-tester-creds
        as: env
    restartPolicy: Never
    # Quoted on purpose: the template guard `if $job.backoffLimit` treats an
    # integer 0 as falsy and would fall through to k8s' default of 6 retries.
    # The string "0" renders as backoffLimit: 0 (no retries) for the full suite.
    backoffLimit: "0"
    concurrencyPolicy: Forbid
    activeDeadlineSeconds: 7200 # 2h hard cap for the full suite
    resources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        cpu: "2000m"
        memory: "4Gi"
    squad: salsa
    alerting:
      runbook_url: "https://myvcita.atlassian.net/wiki/spaces/IT/pages/2170814481/Microservice"
      failure:
        priority: P3
      sequential_failure:
        priority: P2
      timeout:
        priority: P3
      not_executed:
        priority: P2
