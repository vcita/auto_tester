  - name: spotlights # dashboard(5) + layout(2) + settings(4) = 11
    squad: spotlights
    schedule: "10 */2 * * *"
    command: ["python3", "main.py", "run", "--headless", "--env", "$(TARGET_ENV)", "--team", "spotlights"]
    env: *env
