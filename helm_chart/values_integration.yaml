  - name: tempo-misc # documents(3) + reviews(6) + online_presence(2) + settings(2) = 13
    squad: tempo
    schedule: "8 */2 * * *"
    command: ["python3", "main.py", "run", "--headless", "--env", "$(TARGET_ENV)", "--selection", "tempo/documents", "tempo/reviews", "tempo/online_presence", "tempo/settings"]
