{{- $projectName := include "autotester.releaseName" . -}}

{{- range $job := .Values.jobs }}
  {{- with $job.secrets }}
    {{- range . }}
      {{- $esName := printf "%s-%s" $projectName .name -}}
      {{/*
        SSM key defaults to /<environment>/<releaseName>/<secretName>. The k8s
        Secret it syncs into is always per-release (per-namespace), but the
        SOURCE path can be shared: a feature-env secret sets `ssmRelease` to a
        fixed segment so every fenv reads ONE shared SSM param (e.g. the global
        admin token) instead of provisioning an identical param per fenv.
      */}}
      {{- $ssmRelease := .ssmRelease | default $projectName -}}
      {{- $ssmKey := .ssmKey | default (printf "/%s/%s/%s" $.Values.environment $ssmRelease .name) }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $esName }}
spec:
  refreshInterval: {{ $.Values.global.external_secret.refreshInterval }}
  secretStoreRef:
{{- $.Values.global.external_secret.secretStoreRef | toYaml | nindent 4 }}
  target:
    name: {{ $esName }}
{{- if .property }}
  # Extract a single JSON property to one Secret key (ideal for PEM files)
  data:
    - secretKey: {{ default .filename .name }}
      remoteRef:
        key: {{ $ssmKey }}
        property: {{ .property }}
        {{- with .decodingStrategy }}
        decodingStrategy: {{ . }}
        {{- end }}
{{- else }}
  # Extract the entire JSON object; fields become Secret keys (for envFrom)
  dataFrom:
    - extract:
        key: {{ $ssmKey }}
{{- end }}
    {{- end }}
  {{- end }}
{{- end }}
