{{- $projectName := include "autotester.releaseName" . -}}

{{- range $job := .Values.jobs }}
  {{- with $job.secrets }}
    {{- range . }}
      {{- $esName := printf "%s-%s" $projectName .name -}}
      {{- $ssmKey := printf "/%s/%s/%s" $.Values.environment $projectName .name -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ $esName }}
spec:
  refreshInterval: {{ $.Values.global.external_secret.refreshInterval }}
  secretStoreRef:
{{- $.Values.global.external_secret.secretStoreRef | toYaml | nindent 4 }}
  target:
    name: {{ $esName }}
{{- if .property }}
  # Extract a single JSON property to one Secret key (ideal for PEM files)
  data:
    - secretKey: {{ default .filename .name }}
      remoteRef:
        key: {{ $ssmKey }}
        property: {{ .property }}
        {{- with .decodingStrategy }}
        decodingStrategy: {{ . }}
        {{- end }}
{{- else }}
  # Extract the entire JSON object; fields become Secret keys (for envFrom)
  dataFrom:
    - extract:
        key: {{ $ssmKey }}
{{- end }}
---
    {{- end }}
  {{- end }}
{{- end }}
